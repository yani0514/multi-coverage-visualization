<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101820"/>
      <stop offset="55%" stop-color="#1b2633"/>
      <stop offset="100%" stop-color="#0a0f15"/>
    </linearGradient>

    <linearGradient id="whiteStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e9eef6"/>
      <stop offset="100%" stop-color="#b7c2d1"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#74ff56"/>
      <stop offset="100%" stop-color="#12d83d"/>
    </linearGradient>

    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe34f"/>
      <stop offset="100%" stop-color="#ffb400"/>
    </linearGradient>

    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a4d"/>
      <stop offset="100%" stop-color="#ff2d2d"/>
    </linearGradient>

    <linearGradient id="edgeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24f07a"/>
      <stop offset="50%" stop-color="#f3f6ff"/>
      <stop offset="72%" stop-color="#ffcf36"/>
      <stop offset="100%" stop-color="#ff4a4a"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Activity Bar icons are alpha masks: keep the tile and document transparent. -->
  <rect x="42" y="42" width="428" height="428" rx="72"
        fill="none" stroke="url(#edgeGlow)" stroke-width="12"/>

  <!-- Rear document layers -->
  <path d="M206 150 H363 Q382 150 382 169 V366 Q382 385 363 385 H206"
        fill="none" stroke="#dbe4f2" stroke-opacity="0.62" stroke-width="13" stroke-linecap="round"/>
  <path d="M219 169 H382 Q401 169 401 188 V346 Q401 365 382 365 H219"
        fill="none" stroke="#c9d3e2" stroke-opacity="0.45" stroke-width="11" stroke-linecap="round"/>

  <!-- Main document -->
  <path d="M150 118
           H314
           L364 168
           V374
           Q364 398 340 398
           H150
           Q126 398 126 374
           V142
           Q126 118 150 118 Z"
        fill="none"
        stroke="url(#whiteStroke)"
        stroke-width="18"
        stroke-linejoin="round"/>

  <!-- Fold -->
  <path d="M314 118 V160 Q314 168 322 168 H364"
        fill="none"
        stroke="url(#whiteStroke)"
        stroke-width="10"
        stroke-linejoin="round"/>

  <!-- Code symbol -->
  <path d="M210 185 L184 211 L210 237"
        fill="none" stroke="#ffffff" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M280 185 L306 211 L280 237"
        fill="none" stroke="#ffffff" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M259 172 L231 250"
        fill="none" stroke="#ffffff" stroke-width="16"
        stroke-linecap="round"/>

  <!-- Track 1 -->
  <rect x="170" y="278" width="160" height="26" rx="13"
        fill="none" stroke="#dce5f0" stroke-width="6"/>
  <rect x="170" y="278" width="112" height="26" rx="13"
        fill="url(#green)"/>

  <!-- Track 2 -->
  <rect x="170" y="320" width="160" height="26" rx="13"
        fill="none" stroke="#dce5f0" stroke-width="6"/>
  <rect x="170" y="320" width="86" height="26" rx="13"
        fill="url(#yellow)"/>

  <!-- Track 3 -->
  <rect x="170" y="362" width="160" height="26" rx="13"
        fill="none" stroke="#dce5f0" stroke-width="6"/>
  <rect x="170" y="362" width="60" height="26" rx="13"
        fill="url(#red)"/>

  <!-- Soft highlight -->
  <path d="M75 100 Q120 55 196 55"
        fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="18" stroke-linecap="round"/>
</svg>
